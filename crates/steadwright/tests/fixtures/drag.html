<!doctype html><html><body><div id="source" draggable="true" style="width:80px;height:40px;background:#acf">Source</div><div id="target" style="width:100px;height:60px;background:#ddd;margin-top:40px">Target</div><p id="status">before</p><script>const target = document.querySelector('#target'); target.addEventListener('dragover', e => e.preventDefault()); target.addEventListener('drop', e => { e.preventDefault(); document.querySelector('#status').textContent='dropped'; });</script></body></html>
